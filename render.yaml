# Render Blueprint: New → Blueprint → pick this repo.
# One Node web service (app + API) and one Postgres database, in Singapore (closest region to India).
# Free plans: the web service sleeps after 15 idle minutes (first visit then takes ~50 s), and a free
# database expires after 30 days. To use your Render credits instead, change web to `plan: starter`
# and the database to `plan: basic-256mb`.
services:
  - type: web
    name: idlewheels
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: idlewheels-db
          property: connectionString

databases:
  - name: idlewheels-db
    region: singapore
    plan: free
    databaseName: idlewheels
    user: idlewheels
